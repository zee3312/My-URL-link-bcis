<head>

<style>

:root {
    --henna-green: #4F6F52;

    --light-gold: #D8B85A;
    --medium-gold: #C9A63F;
    --dark-gold: #A98224;

    --white: #ffffff;

    --box-blue: #f0f8ff;
    --box-blue-dark: #c5dceb;
}


/* ================================
   BODY
   ================================ */

body {
    font-family: Arial, sans-serif;
    background-color: var(--henna-green);
    margin: 0;
    padding: 0;
    text-align: center;
}


/* ================================
   CONTAINER
   ================================ */

.container {
    margin: 50px auto;
    max-width: 1200px;
}


/* ================================
   TITLE / DATE
   ================================ */

.heading {
    display: inline-block;
    text-align: left;
    margin-right: 30px;
}

h1,
.date {
    font-size: 50px;
    color: var(--white);
    background-color: var(--light-gold);

    padding: 10px 20px;

    font-weight: bold;

    margin: 0;

    box-shadow:
        -6px -6px 10px rgba(255,255,255,0.35),
        7px 7px 12px rgba(0,0,0,0.65),
        inset 3px 3px 5px rgba(255,255,255,0.25),
        inset -3px -3px 5px rgba(0,0,0,0.35);

    border-radius: 0;
}

.date {
    font-size: 35px;
    margin-top: 5px;
}


/* ================================
   DIGITAL CLOCK
   ================================ */

.clock-container {
    display: inline-block;
    vertical-align: top;
    margin-left: 30px;
}

.digital-clock {
    font-family: Arial, sans-serif, monospace;

    font-size: 80px;

    color: var(--white);

    background-color: var(--light-gold);

    padding: 25px;

    width: 600px;

    text-align: center;

    line-height: 1.1;

    font-weight: bold;

    position: relative;

    border-radius: 0;

    box-shadow:
        -6px -6px 10px rgba(255,255,255,0.35),
        7px 7px 12px rgba(0,0,0,0.65),
        inset 3px 3px 5px rgba(255,255,255,0.25),
        inset -3px -3px 5px rgba(0,0,0,0.35);

    border: 5px solid var(--light-gold);
}

.current-time {
    font-size: 20px;

    color: var(--white);

    position: absolute;

    bottom: 10px;

    left: 50%;

    transform: translateX(-50%);

    margin: 0;
}

.ampm {
    font-size: 80px;

    color: var(--white);

    margin-left: 10px;

    display: inline;
}


/* ================================
   PRAYER TABLE
   ================================ */

.prayer-time-table {
    width: 100%;

    border-collapse: separate;

    border-spacing: 8px;

    margin-top: 20px;

    background-color: transparent;
}


/* ================================
   PRAYER BOXES
   ================================ */

.prayer-time-table th,
.prayer-time-table td {

    padding: 25px;

    font-size: 60px;

    font-weight: bold;

    color: var(--henna-green);

    text-align: center;

    position: relative;

    border-radius: 0;

    background: linear-gradient(
        145deg,
        #ffffff 0%,
        var(--box-blue) 50%,
        var(--box-blue-dark) 100%
    );

    box-shadow:
        -6px -6px 10px rgba(255,255,255,0.95),
        7px 7px 12px rgba(0,0,0,0.45),
        inset 3px 3px 5px rgba(255,255,255,0.85),
        inset -3px -3px 5px rgba(0,0,0,0.15);

    text-shadow:
        1px 1px 0 #ffffff,
        2px 2px 0 #3F5942,
        3px 3px 3px rgba(0,0,0,0.30);
}


/* ================================
   TABLE HEADERS
   ================================ */

.prayer-time-table th {

    background: var(--light-gold);

    color: var(--white);

    padding: 10px;

    box-shadow:
        -6px -6px 10px rgba(255,255,255,0.30),
        7px 7px 12px rgba(0,0,0,0.65),
        inset 3px 3px 5px rgba(255,255,255,0.20),
        inset -3px -3px 5px rgba(0,0,0,0.35);

    text-shadow:
        1px 1px 0 #9A833D,
        2px 2px 0 #806D32,
        3px 3px 3px rgba(0,0,0,0.55);
}


/* ================================
   IQAMAH BOXES
   ================================ */

.prayer-time-table tbody td:nth-child(3) {

    background: linear-gradient(
        145deg,
        #ffffff 0%,
        var(--box-blue) 50%,
        var(--box-blue-dark) 100%
    );

    color: var(--henna-green);

    box-shadow:
        -6px -6px 10px rgba(255,255,255,0.95),
        7px 7px 12px rgba(0,0,0,0.45),
        inset 3px 3px 5px rgba(255,255,255,0.85),
        inset -3px -3px 5px rgba(0,0,0,0.15);

    text-shadow:
        1px 1px 0 #ffffff,
        2px 2px 0 #3F5942,
        3px 3px 3px rgba(0,0,0,0.30);
}


/* =====================================================
   ACTIVE PRAYER
   ONLY THE FONT ANIMATES
   ===================================================== */

.flash-text {

    display: inline-block;

    transform-origin: center center;

    /*
       6-second smooth pulse
    */
    animation:
        prayerFontPulse 6s ease-in-out infinite;

    position: relative;

    z-index: 5;

    white-space: nowrap;

    /*
       Gold 3D lettering
    */
    text-shadow:
        1px 1px 0 #fff3c4,
        2px 2px 0 #b89432,
        3px 3px 0 #8f7020,
        4px 4px 5px rgba(0,0,0,0.40);
}


/* =====================================================
   FASTER SMOOTH FONT PULSE
   ===================================================== */

@keyframes prayerFontPulse {

    /* NORMAL */
    0% {
        color: #D8B85A;
        transform: scale(1);
    }

    /* Slowly begins growing */
    15% {
        color: #D5B250;
        transform: scale(1.04);
    }

    /* 110% */
    30% {
        color: #CDAA45;
        transform: scale(1.10);
    }

    /* 118% */
    42% {
        color: #BD9A36;
        transform: scale(1.18);
    }

    /* PEAK — 125% */
    50% {
        color: #A98224;
        transform: scale(1.25);
    }

    /* Brief hold at peak */
    55% {
        color: #A98224;
        transform: scale(1.25);
    }

    /* Smoothly returning */
    68% {
        color: #BD9A36;
        transform: scale(1.18);
    }

    /* 110% */
    80% {
        color: #CDAA45;
        transform: scale(1.10);
    }

    /* 104% */
    90% {
        color: #D5B250;
        transform: scale(1.04);
    }

    /* NORMAL */
    100% {
        color: #D8B85A;
        transform: scale(1);
    }
}


/* ================================
   LOGO
   ================================ */

.logo {

    position: absolute;

    bottom: 20px;

    right: 20px;

    padding: 10px;

    width: 200px;

    box-shadow:
        -4px -4px 10px rgba(255,255,255,0.5),
        4px 4px 20px rgba(0,0,0,1);

    border-radius: 0;
}


/* ================================
   MOBILE
   ================================ */

@media (max-width: 768px) {

    h1,
    .date,
    .prayer-time-table th,
    .prayer-time-table td {
        font-size: 30px;
    }

    .digital-clock {
        font-size: 40px;
        width: 380px;
    }
}

</style>

<script>


/* =========================================
   PRAYER DATA
   ========================================= */

let prayerTimes = {};


/* =========================================
   CONVERT 12-HOUR TIME TO MINUTES
   ========================================= */

function convertToMinutes(timeString) {

    if (!timeString) {
        return null;
    }

    timeString = timeString.trim();


    const match =
        timeString.match(
            /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
        );


    if (!match) {
        return null;
    }


    let hours =
        parseInt(match[1], 10);


    const minutes =
        parseInt(match[2], 10);


    const period =
        match[3].toUpperCase();


    if (period === "AM") {

        if (hours === 12) {
            hours = 0;
        }

    } else {

        if (hours !== 12) {
            hours += 12;
        }

    }


    return (
        hours * 60
    ) + minutes;
}


/* =========================================
   SET TEXT
   ========================================= */

function setText(id, text) {

    const element =
        document.getElementById(id);


    if (element) {
        element.textContent = text;
    }
}


/* =========================================
   ADD / REMOVE FONT ANIMATION
   ========================================= */

function setFlash(rowId, flash) {

    const row =
        document.getElementById(rowId);


    if (!row) {
        return;
    }


    const cells =
        row.querySelectorAll("td");


    cells.forEach(cell => {

        let span =
            cell.querySelector(".prayer-text");


        /*
           Create a text wrapper once.
        */

        if (!span) {

            const text =
                cell.textContent;


            cell.textContent = "";


            span =
                document.createElement("span");


            span.textContent =
                text;


            span.className =
                "prayer-text";


            cell.appendChild(span);
        }


        /*
           ONLY THE FONT gets animated.
        */

        if (flash) {

            span.classList.add(
                "flash-text"
            );

        } else {

            span.classList.remove(
                "flash-text"
            );

        }

    });
}


/* =========================================
   FIND ACTIVE PRAYER
   ========================================= */

function highlightNextPrayer() {

    if (!prayerTimes.fajrIqamah) {
        return;
    }


    const now =
        new Date();


    const currentMinutes =
        (
            now.getHours() * 60
        ) +
        now.getMinutes();


    const prayers = [

        {
            row: "fajr-row",
            iqamah: prayerTimes.fajrIqamah
        },

        {
            row: "zuhr-row",
            iqamah: prayerTimes.zuhrIqamah
        },

        {
            row: "asr-row",
            iqamah: prayerTimes.asrIqamah
        },

        {
            row: "maghrib-row",
            iqamah: prayerTimes.maghribIqamah
        },

        {
            row: "isha-row",
            iqamah: prayerTimes.ishaIqamah
        }

    ];


    let activePrayer = null;


    /*
       Highlight each prayer until
       10 minutes after its Iqamah.
    */

    for (const prayer of prayers) {

        const iqamahMinutes =
            convertToMinutes(
                prayer.iqamah
            );


        if (iqamahMinutes === null) {
            continue;
        }


        const highlightUntil =
            iqamahMinutes + 10;


        if (
            currentMinutes <
            highlightUntil
        ) {

            activePrayer =
                prayer.row;

            break;
        }

    }


    /*
       After the last prayer,
       start the next cycle with Fajr.
    */

    if (!activePrayer) {

        activePrayer =
            "fajr-row";
    }


    /*
       Remove animation from
       every prayer row.
    */

    prayers.forEach(prayer => {

        setFlash(
            prayer.row,
            false
        );

    });


    /*
       Animate ONLY the active row.
    */

    setFlash(
        activePrayer,
        true
    );
}


/* =========================================
   FETCH PRAYER TIMES
   ========================================= */

async function fetchPrayerTimes() {

    try {

        const response =
            await fetch(
                "https://masjidal.com/api/v1/time/range?masjid_id=PAPyordJ"
            );


        const data =
            await response.json();


        const salah =
            data.data.salah[0];


        const iqamah =
            data.data.iqamah[0];


        /* DATE */

        setText(
            "current-date",
            salah.date
        );


        /* SAVE IQAMAH TIMES */

        prayerTimes = {

            fajrIqamah:
                iqamah.fajr,

            zuhrIqamah:
                iqamah.zuhr,

            asrIqamah:
                iqamah.asr,

            maghribIqamah:
                iqamah.maghrib,

            ishaIqamah:
                iqamah.isha
        };


        /* FAJR */

        setText(
            "fajr-time",
            salah.fajr
        );

        setText(
            "fajr-iqamah",
            iqamah.fajr
        );


        /* ZUHR */

        setText(
            "zuhr-time",
            salah.zuhr
        );

        setText(
            "zuhr-iqamah",
            iqamah.zuhr
        );


        /* ASR */

        setText(
            "asr-time",
            salah.asr
        );

        setText(
            "asr-iqamah",
            iqamah.asr
        );


        /* MAGHRIB */

        setText(
            "maghrib-time",
            salah.maghrib
        );

        setText(
            "maghrib-iqamah",
            iqamah.maghrib
        );


        /* ISHA */

        setText(
            "isha-time",
            salah.isha
        );

        setText(
            "isha-iqamah",
            iqamah.isha
        );


        /*
           Update active prayer.
        */

        highlightNextPrayer();

    }

    catch (error) {

        console.error(
            "Unable to load prayer times:",
            error
        );

    }
}


/* =========================================
   DIGITAL CLOCK
   ========================================= */

function updateClock() {

    const now =
        new Date();


    const hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    const formattedHours =
        hours % 12 || 12;


    setText(
        "time",
        `${formattedHours}:${minutes}:${seconds}`
    );


    setText(
        "ampm",
        ampm
    );


    /*
       Check active prayer.
    */

    highlightNextPrayer();
}


/* =========================================
   START
   ========================================= */

fetchPrayerTimes();

updateClock();


/*
   Clock updates every second.
*/

setInterval(
    updateClock,
    1000
);


/*
   Refresh prayer times every 24 hours.
*/

setInterval(
    fetchPrayerTimes,
    24 * 60 * 60 * 1000
);

</script>
