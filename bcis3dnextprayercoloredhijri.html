<!DOCTYPE html>

<head>

<title>Prayer Times</title>

<style>

/* =====================================================
   COLORS
   ===================================================== */

:root {

    --henna-green: #4F6F52;

    --light-gold: #D8B85A;
    --medium-gold: #C9A63F;
    --dark-gold: #A98224;

    --white: #ffffff;

    --box-blue: #f0f8ff;
    --box-blue-dark: #c5dceb;
}


/* =====================================================
   BODY
   ===================================================== */

body {

    font-family: Arial, sans-serif;

    background-color: var(--henna-green);

    margin: 0;
    padding: 0;

    text-align: center;
}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {

    margin: 50px auto;

    max-width: 1200px;
}


/* =====================================================
   HEADING
   ===================================================== */

.heading {

    display: inline-block;

    text-align: left;

    margin-right: 30px;
}


h1,
.date {

    font-size: 50px;

    color: var(--white);

    background-color: var(--light-gold);

    padding: 10px 20px;

    font-weight: bold;

    margin: 0;

    box-shadow:

        -6px -6px 10px rgba(255,255,255,0.35),

        7px 7px 12px rgba(0,0,0,0.65),

        inset 3px 3px 5px rgba(255,255,255,0.25),

        inset -3px -3px 5px rgba(0,0,0,0.35);

    border-radius: 0;
}


.date {

    font-size: 35px;

    margin-top: 5px;
}


/* =====================================================
   HIJRI DATE BOX
   ===================================================== */

.clock-container {

    display: inline-block;

    vertical-align: top;

    margin-left: 30px;
}


.digital-clock {

    font-family: Arial, sans-serif;

    color: var(--white);

    background-color: var(--light-gold);

    padding: 18px 25px;

    width: 600px;

    min-height: 135px;

    text-align: center;

    font-weight: bold;

    position: relative;

    border-radius: 0;

    box-shadow:

        -6px -6px 10px rgba(255,255,255,0.35),

        7px 7px 12px rgba(0,0,0,0.65),

        inset 3px 3px 5px rgba(255,255,255,0.25),

        inset -3px -3px 5px rgba(0,0,0,0.35);

    border: 5px solid var(--light-gold);

    box-sizing: border-box;
}


/* =====================================================
   HIJRI DATE
   ===================================================== */

#hijri-date {

    display: block;

    font-size: 48px;

    line-height: 1.15;

    color: var(--white);

    text-shadow:

        1px 1px 0 #9A833D,

        2px 2px 0 #806D32,

        3px 3px 4px rgba(0,0,0,0.55);
}


/* =====================================================
   RAMADAN INFORMATION
   ===================================================== */

#ramadan-info {

    display: block;

    font-size: 30px;

    margin-top: 8px;

    line-height: 1.15;

    color: var(--white);

    text-shadow:

        1px 1px 0 #9A833D,

        2px 2px 0 #806D32,

        3px 3px 4px rgba(0,0,0,0.45);
}


/* =====================================================
   PRAYER TABLE
   ===================================================== */

.prayer-time-table {

    width: 100%;

    border-collapse: separate;

    border-spacing: 8px;

    margin-top: 20px;

    background-color: transparent;
}


/* =====================================================
   PRAYER BOXES
   ===================================================== */

.prayer-time-table th,
.prayer-time-table td {

    padding: 25px;

    font-size: 60px;

    font-weight: bold;

    color: var(--henna-green);

    text-align: center;

    position: relative;

    border-radius: 0;

    background:

        linear-gradient(

            145deg,

            #ffffff 0%,

            var(--box-blue) 50%,

            var(--box-blue-dark) 100%

        );

    box-shadow:

        -6px -6px 10px rgba(255,255,255,0.95),

        7px 7px 12px rgba(0,0,0,0.45),

        inset 3px 3px 5px rgba(255,255,255,0.85),

        inset -3px -3px 5px rgba(0,0,0,0.15);

    text-shadow:

        1px 1px 0 #ffffff,

        2px 2px 0 #3F5942,

        3px 3px 3px rgba(0,0,0,0.30);
}


/* =====================================================
   TABLE HEADERS
   ===================================================== */

.prayer-time-table th {

    background: var(--light-gold);

    color: var(--white);

    padding: 10px;

    box-shadow:

        -6px -6px 10px rgba(255,255,255,0.30),

        7px 7px 12px rgba(0,0,0,0.65),

        inset 3px 3px 5px rgba(255,255,255,0.20),

        inset -3px -3px 5px rgba(0,0,0,0.35);

    text-shadow:

        1px 1px 0 #9A833D,

        2px 2px 0 #806D32,

        3px 3px 3px rgba(0,0,0,0.55);
}


/* =====================================================
   IQAMAH BOXES
   ===================================================== */

.prayer-time-table tbody td:nth-child(3) {

    background:

        linear-gradient(

            145deg,

            #ffffff 0%,

            var(--box-blue) 50%,

            var(--box-blue-dark) 100%

        );

    color: var(--henna-green);

    box-shadow:

        -6px -6px 10px rgba(255,255,255,0.95),

        7px 7px 12px rgba(0,0,0,0.45),

        inset 3px 3px 5px rgba(255,255,255,0.85),

        inset -3px -3px 5px rgba(0,0,0,0.15);

    text-shadow:

        1px 1px 0 #ffffff,

        2px 2px 0 #3F5942,

        3px 3px 3px rgba(0,0,0,0.30);
}


/* =====================================================
   IMPORTANT:
   ONLY THE TEXT FLASHES.
   
   THE ROW AND BOX DO NOT FLASH.
   ===================================================== */

.flash-text {

    display: inline-block;

    transform-origin: center center;

    position: relative;

    z-index: 5;

    white-space: nowrap;

    animation:

        prayerFontPulse 4.5s ease-in-out infinite;

    text-shadow:

        1px 1px 0 #fff3c4,

        2px 2px 0 #b89432,

        3px 3px 0 #8f7020,

        4px 4px 5px rgba(0,0,0,0.40);
}


/* =====================================================
   SMOOTH FONT FLASH
   
   LOW POINT = 112.5%
   PEAK     = 125%
   
   It NEVER returns to normal 100%.
   ===================================================== */

@keyframes prayerFontPulse {

    0% {

        color: #D8B85A;

        transform: scale(1.125);
    }


    15% {

        color: #D5B250;

        transform: scale(1.15);
    }


    30% {

        color: #CDAA45;

        transform: scale(1.19);
    }


    42% {

        color: #BD9A36;

        transform: scale(1.23);
    }


    50% {

        color: #A98224;

        transform: scale(1.25);
    }


    58% {

        color: #BD9A36;

        transform: scale(1.23);
    }


    70% {

        color: #CDAA45;

        transform: scale(1.19);
    }


    85% {

        color: #D5B250;

        transform: scale(1.15);
    }


    100% {

        color: #D8B85A;

        transform: scale(1.125);
    }
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {

    position: absolute;

    bottom: 20px;

    right: 20px;

    padding: 10px;

    width: 200px;

    box-shadow:

        -4px -4px 10px rgba(255,255,255,0.5),

        4px 4px 20px rgba(0,0,0,1);

    border-radius: 0;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 768px) {

    h1,
    .date,
    .prayer-time-table th,
    .prayer-time-table td {

        font-size: 30px;
    }


    .digital-clock {

        width: 380px;

        min-height: 120px;
    }


    #hijri-date {

        font-size: 34px;
    }


    #ramadan-info {

        font-size: 24px;
    }

}

</style>

<script>


/* =====================================================
   PRAYER DATA
   ===================================================== */

let prayerTimes = {};


/* =====================================================
   HIJRI DATE
   ===================================================== */

function getHijriDate(date = new Date()) {

    try {

        const formatter =

            new Intl.DateTimeFormat(

                "en-US-u-ca-islamic-umalqura",

                {

                    day: "numeric",

                    month: "long",

                    year: "numeric"

                }

            );


        return formatter.format(date);

    }

    catch (error) {

        const formatter =

            new Intl.DateTimeFormat(

                "en-US-u-ca-islamic",

                {

                    day: "numeric",

                    month: "long",

                    year: "numeric"

                }

            );


        return formatter.format(date);
    }

}


/* =====================================================
   GET HIJRI PARTS
   ===================================================== */

function getHijriParts(date = new Date()) {

    let formatter;


    try {

        formatter =

            new Intl.DateTimeFormat(

                "en-US-u-ca-islamic-umalqura",

                {

                    day: "numeric",

                    month: "numeric",

                    year: "numeric"

                }

            );

    }

    catch (error) {

        formatter =

            new Intl.DateTimeFormat(

                "en-US-u-ca-islamic",

                {

                    day: "numeric",

                    month: "numeric",

                    year: "numeric"

                }

            );
    }


    const parts =

        formatter.formatToParts(date);


    const result = {};


    parts.forEach(part => {

        if (

            part.type === "day" ||

            part.type === "month" ||

            part.type === "year"

        ) {

            result[part.type] =

                parseInt(

                    part.value,

                    10

                );
        }

    });


    return result;
}


/* =====================================================
   FIND NEXT RAMADAN
   ===================================================== */

function findNextRamadan() {

    const today =

        new Date();


    const testDate =

        new Date(

            today.getFullYear(),

            today.getMonth(),

            today.getDate()

        );


    for (

        let i = 0;

        i < 430;

        i++

    ) {

        const hijri =

            getHijriParts(testDate);


        if (

            hijri.month === 9 &&

            hijri.day === 1

        ) {

            return new Date(testDate);
        }


        testDate.setDate(

            testDate.getDate() + 1

        );

    }


    return null;
}


/* =====================================================
   UPDATE RAMADAN INFORMATION
   ===================================================== */

function updateRamadanInfo() {

    const today =

        new Date();


    const hijri =

        getHijriParts(today);


    const hijriDate =

        getHijriDate(today);


    document.getElementById(

        "hijri-date"

    ).textContent =

        hijriDate + " AH";


    /*
       Ramadan is Hijri month 9.
    */

    if (

        hijri.month === 9

    ) {

        document.getElementById(

            "ramadan-info"

        ).textContent =

            "🌙 Ramadan Day " +

            hijri.day;


        return;
    }


    const nextRamadan =

        findNextRamadan();


    if (!nextRamadan) {

        document.getElementById(

            "ramadan-info"

        ).textContent =

            "🌙 Ramadan";

        return;
    }


    const todayStart =

        new Date(

            today.getFullYear(),

            today.getMonth(),

            today.getDate()

        );


    const ramadanStart =

        new Date(

            nextRamadan.getFullYear(),

            nextRamadan.getMonth(),

            nextRamadan.getDate()

        );


    const difference =

        ramadanStart -

        todayStart;


    const daysRemaining =

        Math.ceil(

            difference /

            (1000 * 60 * 60 * 24)

        );


    if (

        daysRemaining === 1

    ) {

        document.getElementById(

            "ramadan-info"

        ).textContent =

            "🌙 Ramadan starts tomorrow";

    }

    else {

        document.getElementById(

            "ramadan-info"

        ).textContent =

            "🌙 Ramadan in " +

            daysRemaining +

            " days";

    }

}


/* =====================================================
   CONVERT TIME TO MINUTES
   ===================================================== */

function convertToMinutes(timeString) {

    if (!timeString) {

        return null;
    }


    timeString =

        timeString.trim();


    const match =

        timeString.match(

            /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i

        );


    if (!match) {

        return null;
    }


    let hours =

        parseInt(

            match[1],

            10

        );


    const minutes =

        parseInt(

            match[2],

            10

        );


    const period =

        match[3].toUpperCase();


    if (

        period === "AM"

    ) {

        if (

            hours === 12

        ) {

            hours = 0;
        }

    }

    else {

        if (

            hours !== 12

        ) {

            hours += 12;
        }
    }


    return (

        hours * 60

    ) + minutes;
}


/* =====================================================
   SET TEXT
   ===================================================== */

function setText(id, text) {

    const element =

        document.getElementById(id);


    if (element) {

        element.textContent =

            text;
    }
}


/* =====================================================
   FLASH ONLY THE FONT
   ===================================================== */

function setFlash(rowId, flash) {

    const row =

        document.getElementById(rowId);


    if (!row) {

        return;
    }


    const cells =

        row.querySelectorAll("td");


    cells.forEach(cell => {

        let span =

            cell.querySelector(

                ".prayer-text"

            );


        /*
           Create a span around the
           text only once.
        */

        if (!span) {

            const text =

                cell.textContent;


            cell.textContent = "";


            span =

                document.createElement(

                    "span"

                );


            span.textContent =

                text;


            span.className =

                "prayer-text";


            cell.appendChild(span);
        }


        /*
           Only the span receives
           the animation.

           The TD itself does NOT
           animate.
        */

        if (flash) {

            span.classList.add(

                "flash-text"

            );

        }

        else {

            span.classList.remove(

                "flash-text"

            );
        }

    });

}


/* =====================================================
   FIND ACTIVE PRAYER
   ===================================================== */

function highlightNextPrayer() {

    if (

        !prayerTimes.fajrIqamah

    ) {

        return;
    }


    const now =

        new Date();


    const currentMinutes =

        (

            now.getHours() * 60

        ) +

        now.getMinutes();


    const prayers = [


        {

            row: "fajr-row",

            iqamah:

                prayerTimes.fajrIqamah

        },


        {

            row: "zuhr-row",

            iqamah:

                prayerTimes.zuhrIqamah

        },


        {

            row: "asr-row",

            iqamah:

                prayerTimes.asrIqamah

        },


        {

            row: "maghrib-row",

            iqamah:

                prayerTimes.maghribIqamah

        },


        {

            row: "isha-row",

            iqamah:

                prayerTimes.ishaIqamah

        }


    ];


    let activePrayer =

        null;


    /*
       Keep the prayer active
       until 10 minutes after
       its Iqamah.
    */

    for (

        const prayer of prayers

    ) {

        const iqamahMinutes =

            convertToMinutes(

                prayer.iqamah

            );


        if (

            iqamahMinutes === null

        ) {

            continue;
        }


        const highlightUntil =

            iqamahMinutes + 10;


        if (

            currentMinutes <

            highlightUntil

        ) {

            activePrayer =

                prayer.row;


            break;
        }

    }


    /*
       After the last prayer,
       start again with Fajr.
    */

    if (!activePrayer) {

        activePrayer =

            "fajr-row";
    }


    /*
       Turn off animation
       on every row.
    */

    prayers.forEach(

        prayer => {

            setFlash(

                prayer.row,

                false

            );

        }

    );


    /*
       Turn on animation ONLY
       for the active prayer.
    */

    setFlash(

        activePrayer,

        true

    );

}


/* =====================================================
   FETCH PRAYER TIMES
   ===================================================== */

async function fetchPrayerTimes() {

    try {

        const response =

            await fetch(

                "https://masjidal.com/api/v1/time/range?masjid_id=PAPyordJ"

            );


        const data =

            await response.json();


        const salah =

            data.data.salah[0];


        const iqamah =

            data.data.iqamah[0];


        /*
           Gregorian date.
        */

        setText(

            "current-date",

            salah.date

        );


        /*
           Save Iqamah times.
        */

        prayerTimes = {

            fajrIqamah:

                iqamah.fajr,

            zuhrIqamah:

                iqamah.zuhr,

            asrIqamah:

                iqamah.asr,

            maghribIqamah:

                iqamah.maghrib,

            ishaIqamah:

                iqamah.isha

        };


        /*
           Fajr
        */

        setText(

            "fajr-time",

            salah.fajr

        );


        setText(

            "fajr-iqamah",

            iqamah.fajr

        );


        /*
           Zuhr
        */

        setText(

            "zuhr-time",

            salah.zuhr

        );


        setText(

            "zuhr-iqamah",

            iqamah.zuhr

        );


        /*
           Asr
        */

        setText(

            "asr-time",

            salah.asr

        );


        setText(

            "asr-iqamah",

            iqamah.asr

        );


        /*
           Maghrib
        */

        setText(

            "maghrib-time",

            salah.maghrib

        );


        setText(

            "maghrib-iqamah",

            iqamah.maghrib

        );


        /*
           Isha
        */

        setText(

            "isha-time",

            salah.isha

        );


        setText(

            "isha-iqamah",

            iqamah.isha

        );


        /*
           Update active prayer.
        */

        highlightNextPrayer();

    }


    catch (error) {

        console.error(

            "Unable to load prayer times:",

            error

        );

    }

}


/* =====================================================
   UPDATE DISPLAY
   ===================================================== */

function updateDisplay() {

    updateRamadanInfo();

    highlightNextPrayer();

}


/* =====================================================
   START
   ===================================================== */

fetchPrayerTimes();

updateDisplay();


/*
   Update active prayer and
   Hijri/Ramadan information.
*/

setInterval(

    updateDisplay,

    1000

);


/*
   Refresh prayer times daily.
*/

setInterval(

    fetchPrayerTimes,

    24 * 60 * 60 * 1000

);

</script>
