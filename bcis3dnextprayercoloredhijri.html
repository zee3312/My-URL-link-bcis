<title>Prayer Times</title>

<style>

/* =====================================================
   COLORS
   ===================================================== */

:root {
    --henna-green: #4F6F52;

    --light-gold: #E7CC78;
    --gold: #D8B85A;
    --gold-dark: #B99432;
    --dark-gold: #A98224;

    --box-white: #FFFFFF;
    --box-blue: #F7FBFF;
    --box-blue-mid: #E5F1F8;
    --box-blue-dark: #B8CFDD;
}


/* =====================================================
   BODY
   ===================================================== */

html,
body {

    margin: 0;
    padding: 0;

    min-height: 100%;

    background-color: var(--henna-green);

    font-family: Arial, sans-serif;

    text-align: center;
}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {

    margin: 50px auto;

    max-width: 1200px;

    background-color: var(--henna-green);
}


/* =====================================================
   TITLE AREA
   ===================================================== */

.heading {

    display: inline-block;

    text-align: left;

    margin-right: 30px;
}


h1,
.date {

    color: #FFFFFF;

    background:
        linear-gradient(
            145deg,
            #F5DF9A 0%,
            #E7CC78 25%,
            #D1AE50 60%,
            #A77E22 100%
        );

    padding: 10px 20px;

    font-weight: bold;

    margin: 0;

    border-radius: 0;

    box-shadow:

        /* bright upper-left bevel */
        inset 7px 7px 10px
        rgba(255,255,255,0.60),

        /* dark lower-right bevel */
        inset -8px -8px 12px
        rgba(70,45,0,0.42),

        /* inner highlight */
        inset 2px 2px 3px
        rgba(255,255,255,0.55),

        /* deep 3D shadow */
        7px 7px 5px
        rgba(0,0,0,0.40),

        /* soft shadow */
        10px 10px 15px
        rgba(0,0,0,0.30);

    text-shadow:

        1px 1px 0 #B08D35,
        2px 2px 0 #8B6B21,
        3px 3px 0 #654C13,
        4px 4px 5px
        rgba(0,0,0,0.55);
}


h1 {

    font-size: 50px;
}


.date {

    font-size: 35px;

    margin-top: 5px;
}


/* =====================================================
   HIJRI / RAMADAN BOX
   ===================================================== */

.clock-container {

    display: inline-block;

    vertical-align: top;

    margin-left: 30px;
}


.digital-clock {

    font-family: Arial, sans-serif;

    color: #FFFFFF;

    background:
        linear-gradient(
            145deg,
            #F5DF9A 0%,
            #E7CC78 25%,
            #D1AE50 60%,
            #A77E22 100%
        );

    padding: 18px 25px;

    width: 600px;

    min-height: 135px;

    text-align: center;

    line-height: 1.1;

    font-weight: bold;

    position: relative;

    box-sizing: border-box;

    border-radius: 0;

    border: 5px solid #D1AE50;

    box-shadow:

        inset 7px 7px 10px
        rgba(255,255,255,0.60),

        inset -8px -8px 12px
        rgba(70,45,0,0.42),

        inset 2px 2px 3px
        rgba(255,255,255,0.55),

        7px 7px 5px
        rgba(0,0,0,0.40),

        10px 10px 15px
        rgba(0,0,0,0.30);

    text-shadow:

        1px 1px 0 #B08D35,
        2px 2px 0 #8B6B21,
        3px 3px 0 #654C13,
        4px 4px 5px
        rgba(0,0,0,0.55);
}


#hijri-date {

    display: block;

    font-size: 48px;

    line-height: 1.15;

    color: #FFFFFF;
}


#ramadan-info {

    display: block;

    font-size: 30px;

    margin-top: 8px;

    line-height: 1.15;

    color: #FFFFFF;
}


/* =====================================================
   PRAYER TABLE
   ===================================================== */

.prayer-time-table {

    width: 100%;

    border-collapse: separate;

    /*
       Space between boxes
       remains HENNA GREEN.
    */

    border-spacing: 10px;

    margin-top: 20px;

    background-color: var(--henna-green);

    border: none;

    box-shadow: none;
}


/* =====================================================
   FORCE ALL TABLE GAPS TO HENNA GREEN
   ===================================================== */

.prayer-time-table,
.prayer-time-table thead,
.prayer-time-table tbody,
.prayer-time-table tr {

    background-color: var(--henna-green);

    border: none;
}


/* =====================================================
   MAIN PRAYER BOXES
   ===================================================== */

.prayer-time-table th,
.prayer-time-table td {

    padding: 25px;

    font-size: 60px;

    font-weight: bold;

    text-align: center;

    position: relative;

    border: none;

    border-radius: 0;

    color: var(--henna-green);

    background:
        linear-gradient(
            145deg,
            #FFFFFF 0%,
            #F7FBFF 25%,
            #E5F1F8 55%,
            #B8CFDD 100%
        );

    /*
       STRONG 3D BEVEL
    */

    box-shadow:

        /* very bright raised top-left */
        inset 8px 8px 12px
        rgba(255,255,255,1),

        /* dark recessed bottom-right */
        inset -9px -9px 14px
        rgba(55,75,85,0.40),

        /* secondary inner highlight */
        inset 2px 2px 4px
        rgba(255,255,255,0.95),

        /* strong raised shadow */
        8px 8px 6px
        rgba(0,0,0,0.38),

        /* deeper soft shadow */
        12px 12px 17px
        rgba(0,0,0,0.25);

    /*
       Raised text effect
    */

    text-shadow:

        1px 1px 0 #FFFFFF,

        2px 2px 0 #D2E0E7,

        3px 3px 0 #9DB3BF,

        4px 4px 5px
        rgba(0,0,0,0.38);
}


/* =====================================================
   GOLD TABLE HEADERS
   ===================================================== */

.prayer-time-table th {

    padding: 10px;

    color: #FFFFFF;

    background:
        linear-gradient(
            145deg,
            #F5DF9A 0%,
            #E7CC78 25%,
            #D1AE50 60%,
            #A77E22 100%
        );

    box-shadow:

        inset 8px 8px 12px
        rgba(255,255,255,0.60),

        inset -9px -9px 14px
        rgba(70,45,0,0.45),

        inset 2px 2px 4px
        rgba(255,255,255,0.55),

        8px 8px 6px
        rgba(0,0,0,0.40),

        12px 12px 17px
        rgba(0,0,0,0.28);

    text-shadow:

        1px 1px 0 #B08D35,

        2px 2px 0 #8B6B21,

        3px 3px 0 #654C13,

        4px 4px 5px
        rgba(0,0,0,0.55);
}


/* =====================================================
   IQAMAH BOXES
   SAME 3D EFFECT AS ALL OTHER BOXES
   ===================================================== */

.prayer-time-table tbody td:nth-child(3) {

    color: var(--henna-green);

    background:
        linear-gradient(
            145deg,
            #FFFFFF 0%,
            #F7FBFF 25%,
            #E5F1F8 55%,
            #B8CFDD 100%
        );

    box-shadow:

        inset 8px 8px 12px
        rgba(255,255,255,1),

        inset -9px -9px 14px
        rgba(55,75,85,0.40),

        inset 2px 2px 4px
        rgba(255,255,255,0.95),

        8px 8px 6px
        rgba(0,0,0,0.38),

        12px 12px 17px
        rgba(0,0,0,0.25);

    text-shadow:

        1px 1px 0 #FFFFFF,

        2px 2px 0 #D2E0E7,

        3px 3px 0 #9DB3BF,

        4px 4px 5px
        rgba(0,0,0,0.38);
}


/* =====================================================
   ACTIVE / NEXT PRAYER
   ONLY TEXT FLASHES
   ===================================================== */

.flash-text {

    display: inline-block;

    position: relative;

    z-index: 5;

    white-space: nowrap;

    transform-origin: center center;

    animation:
        prayerFontPulse
        3.2s
        ease-in-out
        infinite;

    text-shadow:

        1px 1px 0 #FFF3C4,

        2px 2px 0 #B89432,

        3px 3px 0 #8F7020,

        4px 4px 6px
        rgba(0,0,0,0.45);
}


/* =====================================================
   NEXT PRAYER FONT ANIMATION

   Starts at 112.5%
   Peaks at 125%
   Returns smoothly
   ===================================================== */

@keyframes prayerFontPulse {

    0% {

        color: #D8B85A;

        transform: scale(1.125);
    }


    12% {

        color: #D6B654;

        transform: scale(1.145);
    }


    25% {

        color: #D0AE48;

        transform: scale(1.18);
    }


    40% {

        color: #C39F38;

        transform: scale(1.22);
    }


    50% {

        color: #A98224;

        transform: scale(1.25);
    }


    60% {

        color: #C39F38;

        transform: scale(1.22);
    }


    75% {

        color: #D0AE48;

        transform: scale(1.18);
    }


    88% {

        color: #D6B654;

        transform: scale(1.145);
    }


    100% {

        color: #D8B85A;

        transform: scale(1.125);
    }
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {

    position: absolute;

    bottom: 20px;

    right: 20px;

    padding: 10px;

    width: 200px;

    box-shadow:

        5px 5px 12px
        rgba(0,0,0,0.65);

    border-radius: 0;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 768px) {

    h1,
    .date,
    .prayer-time-table th,
    .prayer-time-table td {

        font-size: 30px;
    }


    .digital-clock {

        width: 380px;

        min-height: 120px;
    }


    #hijri-date {

        font-size: 34px;
    }


    #ramadan-info {

        font-size: 24px;
    }
}

<script>


/* =====================================================
   PRAYER DATA
   ===================================================== */

let prayerTimes = {};


/* =====================================================
   HIJRI DATE
   ===================================================== */

function getHijriDate(date = new Date()) {

    try {

        const formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic-umalqura",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        return formatter.format(date);

    }

    catch (error) {

        const formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        return formatter.format(date);
    }
}


/* =====================================================
   HIJRI PARTS
   ===================================================== */

function getHijriParts(date = new Date()) {

    let formatter;

    try {

        formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic-umalqura",
                {
                    day: "numeric",
                    month: "numeric",
                    year: "numeric"
                }
            );

    }

    catch (error) {

        formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic",
                {
                    day: "numeric",
                    month: "numeric",
                    year: "numeric"
                }
            );
    }


    const parts =
        formatter.formatToParts(date);


    const result = {};


    parts.forEach(part => {

        if (
            part.type === "day" ||
            part.type === "month" ||
            part.type === "year"
        ) {

            result[part.type] =
                parseInt(
                    part.value,
                    10
                );
        }

    });


    return result;
}


/* =====================================================
   FIND NEXT RAMADAN
   ===================================================== */

function findNextRamadan() {

    const today =
        new Date();


    const testDate =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );


    for (let i = 0; i < 430; i++) {

        const hijri =
            getHijriParts(
                testDate
            );


        if (
            hijri.month === 9 &&
            hijri.day === 1
        ) {

            return new Date(testDate);
        }


        testDate.setDate(
            testDate.getDate() + 1
        );
    }


    return null;
}


/* =====================================================
   UPDATE RAMADAN
   ===================================================== */

function updateRamadanInfo() {

    const today =
        new Date();


    const hijri =
        getHijriParts(today);


    const hijriDate =
        getHijriDate(today);


    document.getElementById(
        "hijri-date"
    ).textContent =
        hijriDate + " AH";


    if (hijri.month === 9) {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan Day " +
            hijri.day;

        return;
    }


    const nextRamadan =
        findNextRamadan();


    if (!nextRamadan) {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan";

        return;
    }


    const todayStart =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );


    const ramadanStart =
        new Date(
            nextRamadan.getFullYear(),
            nextRamadan.getMonth(),
            nextRamadan.getDate()
        );


    const difference =
        ramadanStart -
        todayStart;


    const daysRemaining =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );


    if (daysRemaining === 1) {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan starts tomorrow";

    }

    else {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan in " +
            daysRemaining +
            " days";
    }
}


/* =====================================================
   CONVERT TIME TO MINUTES
   ===================================================== */

function convertToMinutes(timeString) {

    if (!timeString) {

        return null;
    }


    timeString =
        timeString.trim();


    const match =
        timeString.match(
            /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
        );


    if (!match) {

        return null;
    }


    let hours =
        parseInt(
            match[1],
            10
        );


    const minutes =
        parseInt(
            match[2],
            10
        );


    const period =
        match[3].toUpperCase();


    if (period === "AM") {

        if (hours === 12) {

            hours = 0;
        }

    }

    else {

        if (hours !== 12) {

            hours += 12;
        }
    }


    return (
        hours * 60
    ) + minutes;
}


/* =====================================================
   WRAP ROW TEXT
   ===================================================== */

function prepareRow(rowId) {

    const row =
        document.getElementById(
            rowId
        );


    if (!row) {

        return;
    }


    const cells =
        row.querySelectorAll(
            "td"
        );


    cells.forEach(cell => {

        if (
            cell.querySelector(
                ".prayer-text"
            )
        ) {

            return;
        }


        const text =
            cell.textContent;


        cell.textContent = "";


        const span =
            document.createElement(
                "span"
            );


        span.className =
            "prayer-text";


        span.textContent =
            text;


        cell.appendChild(
            span
        );
    });
}


/* =====================================================
   FLASH ONLY TEXT
   ===================================================== */

function setFlash(rowId, flash) {

    const row =
        document.getElementById(
            rowId
        );


    if (!row) {

        return;
    }


    prepareRow(rowId);


    const spans =
        row.querySelectorAll(
            ".prayer-text"
        );


    spans.forEach(span => {

        if (flash) {

            span.classList.add(
                "flash-text"
            );

        }

        else {

            span.classList.remove(
                "flash-text"
            );
        }

    });
}


/* =====================================================
   FIND NEXT PRAYER
   ===================================================== */

function highlightNextPrayer() {

    if (
        !prayerTimes.fajrIqamah
    ) {

        return;
    }


    const now =
        new Date();


    const currentMinutes =
        (now.getHours() * 60) +
        now.getMinutes();


    const prayers = [

        {
            row: "fajr-row",
            iqamah:
                prayerTimes.fajrIqamah
        },

        {
            row: "zuhr-row",
            iqamah:
                prayerTimes.zuhrIqamah
        },

        {
            row: "asr-row",
            iqamah:
                prayerTimes.asrIqamah
        },

        {
            row: "maghrib-row",
            iqamah:
                prayerTimes.maghribIqamah
        },

        {
            row: "isha-row",
            iqamah:
                prayerTimes.ishaIqamah
        }

    ];


    let activePrayer = null;


    /*
       First check the 10-minute
       period after Iqamah.
    */

    for (
        const prayer of prayers
    ) {

        const iqamahMinutes =
            convertToMinutes(
                prayer.iqamah
            );


        if (
            iqamahMinutes === null
        ) {

            continue;
        }


        const highlightUntil =
            iqamahMinutes + 10;


        if (
            currentMinutes >=
            iqamahMinutes &&

            currentMinutes <
            highlightUntil
        ) {

            activePrayer =
                prayer.row;

            break;
        }
    }


    /*
       Otherwise find next prayer.
    */

    if (!activePrayer) {

        for (
            const prayer of prayers
        ) {

            const iqamahMinutes =
                convertToMinutes(
                    prayer.iqamah
                );


            if (
                iqamahMinutes !== null &&

                iqamahMinutes >
                currentMinutes
            ) {

                activePrayer =
                    prayer.row;

                break;
            }
        }
    }


    /*
       After Isha, use Fajr.
    */

    if (!activePrayer) {

        activePrayer =
            "fajr-row";
    }


    /*
       Stop every row from flashing.
    */

    prayers.forEach(
        prayer => {

            setFlash(
                prayer.row,
                false
            );

        }
    );


    /*
       Flash ONLY the active
       prayer's letters.
    */

    setFlash(
        activePrayer,
        true
    );
}


/* =====================================================
   FETCH PRAYER TIMES
   ===================================================== */

async function fetchPrayerTimes() {

    try {

        const response =
            await fetch(
                "https://masjidal.com/api/v1/time/range?masjid_id=PAPyordJ"
            );


        const data =
            await response.json();


        const salah =
            data.data.salah[0];


        const iqamah =
            data.data.iqamah[0];


        document.getElementById(
            "current-date"
        ).textContent =
            salah.date;


        prayerTimes = {

            fajrIqamah:
                iqamah.fajr,

            zuhrIqamah:
                iqamah.zuhr,

            asrIqamah:
                iqamah.asr,

            maghribIqamah:
                iqamah.maghrib,

            ishaIqamah:
                iqamah.isha
        };


        document.getElementById(
            "fajr-time"
        ).textContent =
            salah.fajr;


        document.getElementById(
            "fajr-iqamah"
        ).textContent =
            iqamah.fajr;


        document.getElementById(
            "zuhr-time"
        ).textContent =
            salah.zuhr;


        document.getElementById(
            "zuhr-iqamah"
        ).textContent =
            iqamah.zuhr;


        document.getElementById(
            "asr-time"
        ).textContent =
            salah.asr;


        document.getElementById(
            "asr-iqamah"
        ).textContent =
            iqamah.asr;


        document.getElementById(
            "maghrib-time"
        ).textContent =
            salah.maghrib;


        document.getElementById(
            "maghrib-iqamah"
        ).textContent =
            iqamah.maghrib;


        document.getElementById(
            "isha-time"
        ).textContent =
            salah.isha;


        document.getElementById(
            "isha-iqamah"
        ).textContent =
            iqamah.isha;


        highlightNextPrayer();

    }

    catch (error) {

        console.error(
            "Unable to load prayer times:",
            error
        );
    }
}


/* =====================================================
   UPDATE DISPLAY
   ===================================================== */

function updateDisplay() {

    updateRamadanInfo();

    highlightNextPrayer();
}


/* =====================================================
   START
   ===================================================== */

fetchPrayerTimes();

updateDisplay();


/*
   Update active prayer every second.
*/

setInterval(
    updateDisplay,
    1000
);


/*
   Refresh prayer times every 24 hours.
*/

setInterval(
    fetchPrayerTimes,
    24 * 60 * 60 * 1000
);

</script>
