<title>Prayer Times</title>

<style>

/* =====================================================
   COLORS
   ===================================================== */

:root {

    --henna-green: #4F6F52;

    --light-gold: #D8B85A;

    --gold-light: #E7CC78;

    --gold-dark: #B99432;

    --dark-gold: #A98224;

    --white: #FFFFFF;

    --box-blue: #F0F8FF;

    --box-blue-dark: #C5DCEB;
}


/* =====================================================
   BODY
   ===================================================== */

html,
body {

    margin: 0;

    padding: 0;

    min-height: 100%;

    background-color: #4F6F52;

    font-family: Arial, sans-serif;

    text-align: center;
}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {

    margin: 50px auto;

    max-width: 1200px;

    background-color: #4F6F52;
}


/* =====================================================
   TITLE
   ===================================================== */

.heading {

    display: inline-block;

    text-align: left;

    margin-right: 30px;
}


h1,
.date {

    font-size: 50px;

    color: #FFFFFF;

    background:

        linear-gradient(
            145deg,
            #E7CC78 0%,
            #D8B85A 50%,
            #B99432 100%
        );

    padding: 10px 20px;

    font-weight: bold;

    margin: 0;

    border-radius: 0;

    box-shadow:

        inset 5px 5px 8px
        rgba(255,255,255,0.35),

        inset -5px -5px 8px
        rgba(0,0,0,0.30),

        5px 5px 8px
        rgba(0,0,0,0.50);

    text-shadow:

        1px 1px 0 #9A833D,

        2px 2px 0 #806D32,

        3px 3px 3px
        rgba(0,0,0,0.55);
}


.date {

    font-size: 35px;

    margin-top: 5px;
}


/* =====================================================
   HIJRI / RAMADAN BOX
   ===================================================== */

.clock-container {

    display: inline-block;

    vertical-align: top;

    margin-left: 30px;
}


.digital-clock {

    font-family: Arial, sans-serif;

    color: #FFFFFF;

    background:

        linear-gradient(
            145deg,
            #E7CC78 0%,
            #D8B85A 50%,
            #B99432 100%
        );

    padding: 18px 25px;

    width: 600px;

    min-height: 135px;

    text-align: center;

    font-weight: bold;

    position: relative;

    box-sizing: border-box;

    border-radius: 0;

    border: 5px solid #D8B85A;

    box-shadow:

        inset 5px 5px 8px
        rgba(255,255,255,0.35),

        inset -5px -5px 8px
        rgba(0,0,0,0.30),

        5px 5px 8px
        rgba(0,0,0,0.50);

    text-shadow:

        1px 1px 0 #9A833D,

        2px 2px 0 #806D32,

        3px 3px 3px
        rgba(0,0,0,0.55);
}


/* =====================================================
   HIJRI DATE
   ===================================================== */

#hijri-date {

    display: block;

    font-size: 48px;

    line-height: 1.15;

    color: #FFFFFF;
}


/* =====================================================
   RAMADAN INFORMATION
   ===================================================== */

#ramadan-info {

    display: block;

    font-size: 30px;

    margin-top: 8px;

    line-height: 1.15;

    color: #FFFFFF;
}


/* =====================================================
   PRAYER TABLE

   EVERYTHING AROUND THE BOXES IS
   THE SAME HENNA GREEN
   ===================================================== */

.prayer-time-table {

    width: 100%;

    border-collapse: separate;

    border-spacing: 10px;

    margin-top: 20px;

    background-color: #4F6F52;

    border: none;

    box-shadow: none;
}


/* =====================================================
   FORCE TABLE STRUCTURE GREEN
   ===================================================== */

.prayer-time-table thead,
.prayer-time-table tbody,
.prayer-time-table tr {

    background-color: #4F6F52;

    border: none;
}


/* =====================================================
   ALL PRAYER BOXES
   ===================================================== */

.prayer-time-table th,
.prayer-time-table td {

    padding: 25px;

    font-size: 60px;

    font-weight: bold;

    text-align: center;

    position: relative;

    border: none;

    border-radius: 0;

    color: #4F6F52;

    background:

        linear-gradient(
            145deg,
            #FFFFFF 0%,
            #F0F8FF 50%,
            #C5DCEB 100%
        );

    /*
       3D EFFECT

       IMPORTANT:
       The bright white effect is
       INSIDE the box.

       It cannot bleed into the
       henna-green gaps.
    */

    box-shadow:

        inset 5px 5px 8px
        rgba(255,255,255,0.95),

        inset -5px -5px 8px
        rgba(0,0,0,0.20),

        5px 5px 8px
        rgba(0,0,0,0.45);

    text-shadow:

        1px 1px 0 #FFFFFF,

        2px 2px 0 #3F5942,

        3px 3px 3px
        rgba(0,0,0,0.30);
}


/* =====================================================
   GOLD TABLE HEADERS
   ===================================================== */

.prayer-time-table th {

    padding: 10px;

    color: #FFFFFF;

    background:

        linear-gradient(
            145deg,
            #E7CC78 0%,
            #D8B85A 50%,
            #B99432 100%
        );

    box-shadow:

        inset 5px 5px 8px
        rgba(255,255,255,0.35),

        inset -5px -5px 8px
        rgba(0,0,0,0.30),

        5px 5px 8px
        rgba(0,0,0,0.50);

    text-shadow:

        1px 1px 0 #9A833D,

        2px 2px 0 #806D32,

        3px 3px 3px
        rgba(0,0,0,0.55);
}


/* =====================================================
   IQAMAH BOXES
   ===================================================== */

.prayer-time-table tbody td:nth-child(3) {

    background:

        linear-gradient(
            145deg,
            #FFFFFF 0%,
            #F0F8FF 50%,
            #C5DCEB 100%
        );

    color: #4F6F52;

    box-shadow:

        inset 5px 5px 8px
        rgba(255,255,255,0.95),

        inset -5px -5px 8px
        rgba(0,0,0,0.20),

        5px 5px 8px
        rgba(0,0,0,0.45);

    text-shadow:

        1px 1px 0 #FFFFFF,

        2px 2px 0 #3F5942,

        3px 3px 3px
        rgba(0,0,0,0.30);
}


/* =====================================================
   ACTIVE PRAYER

   ONLY THE TEXT FLASHES.
   THE BOX DOES NOT FLASH.
   ===================================================== */

.flash-text {

    display: inline-block;

    position: relative;

    z-index: 5;

    white-space: nowrap;

    transform-origin: center center;

    animation:

        prayerFontPulse 4.5s
        ease-in-out
        infinite;

    text-shadow:

        1px 1px 0 #FFF3C4,

        2px 2px 0 #B89432,

        3px 3px 0 #8F7020,

        4px 4px 5px
        rgba(0,0,0,0.40);
}


/* =====================================================
   FLASH ANIMATION

   MINIMUM = 112.5%

   MAXIMUM = 125%

   COLOR:
   LIGHT GOLD -> DARKER GOLD -> LIGHT GOLD
   ===================================================== */

@keyframes prayerFontPulse {

    0% {

        color: #D8B85A;

        transform: scale(1.125);
    }


    15% {

        color: #D5B250;

        transform: scale(1.15);
    }


    30% {

        color: #CDAA45;

        transform: scale(1.19);
    }


    42% {

        color: #BD9A36;

        transform: scale(1.23);
    }


    50% {

        color: #A98224;

        transform: scale(1.25);
    }


    58% {

        color: #BD9A36;

        transform: scale(1.23);
    }


    70% {

        color: #CDAA45;

        transform: scale(1.19);
    }


    85% {

        color: #D5B250;

        transform: scale(1.15);
    }


    100% {

        color: #D8B85A;

        transform: scale(1.125);
    }
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {

    position: absolute;

    bottom: 20px;

    right: 20px;

    padding: 10px;

    width: 200px;

    box-shadow:

        4px 4px 12px
        rgba(0,0,0,0.65);

    border-radius: 0;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 768px) {

    h1,
    .date,
    .prayer-time-table th,
    .prayer-time-table td {

        font-size: 30px;
    }


    .digital-clock {

        width: 380px;

        min-height: 120px;
    }


    #hijri-date {

        font-size: 34px;
    }


    #ramadan-info {

        font-size: 24px;
    }
}

</style>

<script>


/* =====================================================
   PRAYER DATA
   ===================================================== */

let prayerTimes = {};


/* =====================================================
   HIJRI DATE
   ===================================================== */

function getHijriDate(date = new Date()) {

    try {

        const formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic-umalqura",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        return formatter.format(date);

    }

    catch (error) {

        const formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        return formatter.format(date);
    }
}


/* =====================================================
   HIJRI PARTS
   ===================================================== */

function getHijriParts(date = new Date()) {

    let formatter;

    try {

        formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic-umalqura",
                {
                    day: "numeric",
                    month: "numeric",
                    year: "numeric"
                }
            );

    }

    catch (error) {

        formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-islamic",
                {
                    day: "numeric",
                    month: "numeric",
                    year: "numeric"
                }
            );
    }


    const parts =
        formatter.formatToParts(date);


    const result = {};


    parts.forEach(part => {

        if (

            part.type === "day" ||

            part.type === "month" ||

            part.type === "year"

        ) {

            result[part.type] =
                parseInt(
                    part.value,
                    10
                );
        }

    });


    return result;
}


/* =====================================================
   FIND NEXT RAMADAN
   ===================================================== */

function findNextRamadan() {

    const today =
        new Date();


    const testDate =
        new Date(

            today.getFullYear(),

            today.getMonth(),

            today.getDate()

        );


    for (let i = 0; i < 430; i++) {

        const hijri =
            getHijriParts(
                testDate
            );


        if (

            hijri.month === 9 &&

            hijri.day === 1

        ) {

            return new Date(
                testDate
            );
        }


        testDate.setDate(
            testDate.getDate() + 1
        );
    }


    return null;
}


/* =====================================================
   UPDATE RAMADAN INFORMATION
   ===================================================== */

function updateRamadanInfo() {

    const today =
        new Date();


    const hijri =
        getHijriParts(
            today
        );


    const hijriDate =
        getHijriDate(
            today
        );


    document.getElementById(
        "hijri-date"
    ).textContent =
        hijriDate + " AH";


    if (hijri.month === 9) {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan Day " +
            hijri.day;

        return;
    }


    const nextRamadan =
        findNextRamadan();


    if (!nextRamadan) {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan";

        return;
    }


    const todayStart =
        new Date(

            today.getFullYear(),

            today.getMonth(),

            today.getDate()

        );


    const ramadanStart =
        new Date(

            nextRamadan.getFullYear(),

            nextRamadan.getMonth(),

            nextRamadan.getDate()

        );


    const difference =
        ramadanStart -
        todayStart;


    const daysRemaining =
        Math.ceil(

            difference /

            (1000 * 60 * 60 * 24)

        );


    if (daysRemaining === 1) {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan starts tomorrow";

    }

    else {

        document.getElementById(
            "ramadan-info"
        ).textContent =
            "🌙 Ramadan in " +
            daysRemaining +
            " days";
    }
}


/* =====================================================
   CONVERT PRAYER TIME TO MINUTES
   ===================================================== */

function convertToMinutes(timeString) {

    if (!timeString) {

        return null;
    }


    timeString =
        timeString.trim();


    const match =
        timeString.match(

            /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i

        );


    if (!match) {

        return null;
    }


    let hours =
        parseInt(
            match[1],
            10
        );


    const minutes =
        parseInt(
            match[2],
            10
        );


    const period =
        match[3].toUpperCase();


    if (period === "AM") {

        if (hours === 12) {

            hours = 0;
        }

    }

    else {

        if (hours !== 12) {

            hours += 12;
        }
    }


    return (

        hours * 60

    ) + minutes;
}


/* =====================================================
   FLASH ONLY TEXT
   ===================================================== */

function setFlash(rowId, flash) {

    const row =
        document.getElementById(
            rowId
        );


    if (!row) {

        return;
    }


    const cells =
        row.querySelectorAll(
            "td"
        );


    cells.forEach(cell => {

        let span =
            cell.querySelector(
                ".prayer-text"
            );


        if (!span) {

            const text =
                cell.textContent;


            cell.textContent = "";


            span =
                document.createElement(
                    "span"
                );


            span.textContent =
                text;


            span.className =
                "prayer-text";


            cell.appendChild(
                span
            );
        }


        if (flash) {

            span.classList.add(
                "flash-text"
            );

        }

        else {

            span.classList.remove(
                "flash-text"
            );
        }

    });
}


/* =====================================================
   FIND CURRENT / NEXT PRAYER
   ===================================================== */

function highlightNextPrayer() {

    if (!prayerTimes.fajrIqamah) {

        return;
    }


    const now =
        new Date();


    const currentMinutes =

        (now.getHours() * 60) +

        now.getMinutes();


    const prayers = [

        {
            row: "fajr-row",
            iqamah:
                prayerTimes.fajrIqamah
        },

        {
            row: "zuhr-row",
            iqamah:
                prayerTimes.zuhrIqamah
        },

        {
            row: "asr-row",
            iqamah:
                prayerTimes.asrIqamah
        },

        {
            row: "maghrib-row",
            iqamah:
                prayerTimes.maghribIqamah
        },

        {
            row: "isha-row",
            iqamah:
                prayerTimes.ishaIqamah
        }

    ];


    let activePrayer =
        null;


    /*
       First check the 10-minute
       period after Iqamah.
    */

    for (const prayer of prayers) {

        const iqamahMinutes =
            convertToMinutes(
                prayer.iqamah
            );


        if (
            iqamahMinutes === null
        ) {

            continue;
        }


        const highlightUntil =
            iqamahMinutes + 10;


        if (

            currentMinutes >=
            iqamahMinutes &&

            currentMinutes <
            highlightUntil

        ) {

            activePrayer =
                prayer.row;

            break;
        }
    }


    /*
       If we are not inside the
       10-minute period, find the
       next upcoming prayer.
    */

    if (!activePrayer) {

        for (const prayer of prayers) {

            const iqamahMinutes =
                convertToMinutes(
                    prayer.iqamah
                );


            if (

                iqamahMinutes !== null &&

                iqamahMinutes >
                currentMinutes

            ) {

                activePrayer =
                    prayer.row;

                break;
            }
        }
    }


    /*
       After Isha, use Fajr.
    */

    if (!activePrayer) {

        activePrayer =
            "fajr-row";
    }


    /*
       Turn off all flashing.
    */

    prayers.forEach(prayer => {

        setFlash(
            prayer.row,
            false
        );

    });


    /*
       Turn on flashing ONLY
       for the active prayer.
    */

    setFlash(
        activePrayer,
        true
    );
}


/* =====================================================
   FETCH PRAYER TIMES
   ===================================================== */

async function fetchPrayerTimes() {

    try {

        const response =
            await fetch(

                "https://masjidal.com/api/v1/time/range?masjid_id=PAPyordJ"

            );


        const data =
            await response.json();


        const salah =
            data.data.salah[0];


        const iqamah =
            data.data.iqamah[0];


        document.getElementById(
            "current-date"
        ).textContent =
            salah.date;


        prayerTimes = {

            fajrIqamah:
                iqamah.fajr,

            zuhrIqamah:
                iqamah.zuhr,

            asrIqamah:
                iqamah.asr,

            maghribIqamah:
                iqamah.maghrib,

            ishaIqamah:
                iqamah.isha

        };


        document.getElementById(
            "fajr-time"
        ).textContent =
            salah.fajr;


        document.getElementById(
            "fajr-iqamah"
        ).textContent =
            iqamah.fajr;


        document.getElementById(
            "zuhr-time"
        ).textContent =
            salah.zuhr;


        document.getElementById(
            "zuhr-iqamah"
        ).textContent =
            iqamah.zuhr;


        document.getElementById(
            "asr-time"
        ).textContent =
            salah.asr;


        document.getElementById(
            "asr-iqamah"
        ).textContent =
            iqamah.asr;


        document.getElementById(
            "maghrib-time"
        ).textContent =
            salah.maghrib;


        document.getElementById(
            "maghrib-iqamah"
        ).textContent =
            iqamah.maghrib;


        document.getElementById(
            "isha-time"
        ).textContent =
            salah.isha;


        document.getElementById(
            "isha-iqamah"
        ).textContent =
            iqamah.isha;


        highlightNextPrayer();

    }

    catch (error) {

        console.error(
            "Unable to load prayer times:",
            error
        );
    }
}


/* =====================================================
   UPDATE EVERYTHING
   ===================================================== */

function updateDisplay() {

    updateRamadanInfo();

    highlightNextPrayer();
}


/* =====================================================
   START
   ===================================================== */

fetchPrayerTimes();

updateDisplay();


/*
   Check every second so the
   active prayer changes automatically.
*/

setInterval(

    updateDisplay,

    1000

);


/*
   Refresh prayer data every 24 hours.
*/

setInterval(

    fetchPrayerTimes,

    24 * 60 * 60 * 1000

);

</script>
